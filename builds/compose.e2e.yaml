name: account-e2e

x-postgres-environment: &postgres-environment
  POSTGRES_PASSWORD: postgres
  POSTGRES_USER: postgres
  POSTGRES_DB: postgres
  POSTGRES_HOST_AUTH_METHOD: scram-sha-256
  POSTGRES_INITDB_ARGS: --auth=scram-sha-256

# Stands in for the cluster's service-account issuer, so Authentication requires a service token as in production.
x-service-token-issuer: &service-token-issuer http://service-token-issuer:8080

x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD", "pg_isready", "-U", "postgres"]
  interval: 1s
  timeout: 5s
  retries: 30

services:
  postgres-authentication:
    image: ghcr.io/a-novel/service-authentication/database:v2.25.4@sha256:eacb92cda967cca5fd86c5b13d652cb4b6de3ba66794c7ceb7428b62970831e1
    environment: *postgres-environment
    healthcheck: *postgres-healthcheck

  postgres-json-keys:
    image: ghcr.io/a-novel/service-json-keys/database:v2.15.7@sha256:06457d216da6416e58262893731c6caf4382d74e89baa13aa79eaffd629c771c
    environment: *postgres-environment
    healthcheck: *postgres-healthcheck

  postgres-profile:
    image: ghcr.io/a-novel/service-profile/database:v1.0.1@sha256:5f8b6a6002d3a1bde29ff8df74842dc584df6c73484f26a3da23b155605b2d42
    environment: *postgres-environment
    healthcheck: *postgres-healthcheck

  mailserver:
    image: ghcr.io/axllent/mailpit:v1.33.0
    ports:
      - "127.0.0.1:14825:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_DISABLE_WAL: "true"

  service-json-keys:
    image: ghcr.io/a-novel/service-json-keys/standalone-grpc:v2.15.7@sha256:1078a75cbf3d691f450328f40e57d0a9a5c7a7d13b96c176d7ebe41a61ca0fc3
    healthcheck:
      test: ["CMD", "grpcurl", "--plaintext", "-d", "", "localhost:8080", "grpc.health.v1.Health/Check"]
      interval: 1s
      timeout: 5s
      retries: 30
    depends_on:
      postgres-json-keys:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres-json-keys
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: "false"
      APP_MASTER_KEY: fec0681a2f57242211c559ca347721766f8a3acd8ed2e63b36b3768051c702ca

  # JSON keys' public API, whose keys verify access tokens on the platform.
  json-keys-rest:
    image: ghcr.io/a-novel/service-json-keys/rest:v2.15.7@sha256:e93412c2570837c87cd39fff15589ce25abad11b89268213d680aabc44bef4a1
    ports:
      - "127.0.0.1:14103:8080"
    # The gRPC server's start migrates the database and creates the keys this server lists.
    depends_on:
      service-json-keys:
        condition: service_healthy
    # Podman ignores the image's own check, so the journeys' wait needs this one.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/v2/ping"]
      interval: 1s
      timeout: 5s
      retries: 30
    environment:
      POSTGRES_HOST: postgres-json-keys
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: "false"

  service-token-issuer:
    image: ghcr.io/a-novel/service-authentication/service-token-issuer:v2.25.4@sha256:6e74b2cd9752162a59cae69368f949361309c55a66160e9137576d91ed7ff78a
    ports:
      - "127.0.0.1:14101:8080"
    environment:
      SERVICE_TOKEN_ISSUER: *service-token-issuer
    # Podman ignores the image's own check, so the wait of authentication needs this one.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/.well-known/openid-configuration"]
      interval: 1s
      timeout: 5s
      retries: 30

  # Holds the network authentication joins, so the outage journey's restart leaves the host's
  # interfaces alone. A new interface makes Chromium abort loading pages with ERR_NETWORK_CHANGED.
  authentication-network:
    image: registry.k8s.io/pause:3.10.2
    ports:
      - "127.0.0.1:14100:8080"

  authentication:
    image: ghcr.io/a-novel/service-authentication/standalone-rest:v2.25.4@sha256:e53dd6cd1c7af0419def5a4b95b1dd5852bf55a221076bf17ab5814d9c7ffec1
    network_mode: service:authentication-network
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/v2/ping"]
      interval: 1s
      timeout: 5s
      retries: 30
    depends_on:
      postgres-authentication:
        condition: service_healthy
      service-json-keys:
        condition: service_healthy
      mailserver:
        condition: service_started
      service-token-issuer:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        /migrations &&
        /maintenance account-role --email admin@account.test --role auth:superadmin --lang en &&
        exec /rest
    environment:
      POSTGRES_HOST: postgres-authentication
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: "false"
      SERVICE_JSON_KEYS_HOST: service-json-keys
      SERVICE_JSON_KEYS_PORT: 8080
      PLATFORM_AUTH_URL: http://127.0.0.1:4173
      # As in production: the visitor's address comes from the platform, not from the connection.
      REST_CLIENT_IP_HEADER: X-Client-IP
      SMTP_SENDER_DOMAIN: mailserver
      SMTP_ADDR: mailserver:1025
      SMTP_SENDER_NAME: Account integration tests
      SMTP_SENDER_EMAIL: noreply@account.test
      SMTP_SENDER_PASSWORD: test-only
      SMTP_FORCE_UNENCRYPTED: "true"
      # Every journey comes from one address and mints its own anonymous session.
      REST_RATE_LIMITS_ENABLED: "false"
      SERVICE_TOKEN_ISSUER: *service-token-issuer
      SERVICE_TOKEN_AUDIENCE: authentication
      SERVICE_TOKEN_CALLERS: system:serviceaccount:account:web,system:serviceaccount:client:web
      # The stub client of tests/e2e/client.ts. Its redirect URI has a query, which every response keeps.
      OAUTH_CLIENTS: >-
        {"client": {"redirectURI": "http://127.0.0.1:4181/auth/callback?tenant=e2e",
        "caller": "system:serviceaccount:client:web"}}

  # Stores each user's username and picture. Its image migrates the database before it serves.
  profile:
    image: ghcr.io/a-novel/service-profile/standalone-rest:v1.0.1@sha256:95c4ac030cc0de06747897718574f80fd537f410767ca202883b60cc2f890a32
    ports:
      - "127.0.0.1:14104:8080"
    # Podman ignores the image's own check, so the journeys' wait needs this one.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/v1/ping"]
      interval: 1s
      timeout: 5s
      retries: 30
    depends_on:
      postgres-profile:
        condition: service_healthy
      service-json-keys:
        condition: service_healthy
      service-token-issuer:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres-profile
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: "false"
      SERVICE_JSON_KEYS_HOST: service-json-keys
      SERVICE_JSON_KEYS_PORT: 8080
      # As in production: the visitor's address comes from the platform, not from the connection.
      REST_CLIENT_IP_HEADER: X-Client-IP
      # Every journey comes from one address, and each page load reads the profile.
      REST_RATE_LIMITS_ENABLED: "false"
      SERVICE_TOKEN_ISSUER: *service-token-issuer
      SERVICE_TOKEN_AUDIENCE: profile
      SERVICE_TOKEN_CALLERS: system:serviceaccount:account:web
